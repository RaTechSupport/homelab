# /etc/ssh/sshd_config.d/50-backuppull.conf (root:root 644)
# 'backuppull': read-only SFTP account for the owner's PC to fetch the encrypted backup copies
# (scripts/backup-mirror.sh -> /var/backups/jarvis_outbox/files). Key only, no shell, no forwarding,
# locked into the outbox (chroot), SFTP read-only (-R). Key: /etc/ssh/authorized_keys/backuppull.
Match User backuppull
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ChrootDirectory /var/backups/jarvis_outbox
    ForceCommand internal-sftp -R
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
# end the Match block so nothing after this file is limited to backuppull
Match all
